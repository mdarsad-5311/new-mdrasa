[project]
name = "new-mdrasa"
version = "0.1.0"
description = "Madrasa Al-Umaima ERP Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0,<7.0",
    "djangorestframework>=3.14.0",
    "djangorestframework-simplejwt>=5.3.0",
    "django-cors-headers>=4.3.0",
    "django-filter>=24.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "whitenoise>=6.6.0",
    "gunicorn>=21.2.0",
    "dj-database-url>=2.1.0",
]

[tool.pyright]
include = ["backend"]
extraPaths = ["backend", "backend/apps"]
reportMissingTypeStubs = "none"
reportIncompatibleVariableOverride = "none"

[tool.pytest.ini_options]
pythonpath = ["backend", "backend/apps"]

[tool.vercel]
entrypoint = "backend.config.asgi:application"

